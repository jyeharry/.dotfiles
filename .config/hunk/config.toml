mode = "auto"
line_numbers = true
wrap_lines = true

theme = "tokyonight-moon"
hunk_headers = true
menu_bar = false
agent_notes = false
copy_decorations = false
cursor_line = "row"

[themes.tokyonight-moon]
base = "tokyo-night"
label = "tokyonight-moon"

# Surfaces
background  = "#222436"      # bg
panel       = "#222436"      # bg_dark (sidebar / statusline / floats) "#1e2030"
panelAlt    = "#2f334d"      # bg_highlight (menu bar)
border      = "#3b4261"      # fg_gutter
accent      = "#82aaff"      # blue
accentMuted = "#2d3f76"      # bg_visual (selected menu / dialog items)
text        = "#c8d3f5"      # fg
muted       = "#828bb8"      # fg_dark
 
# Diff rows (delta: plus/minus-style) and word emphasis (plus/minus-emph-style)
addedBg          = "#2a4556" # diff.add
removedBg        = "#4b2a3d" # diff.delete
addedContentBg   = "#305f6f"
removedContentBg = "#6b2e43"
movedAddedBg     = "#343d5c" # git.change blended 20% over bg
movedRemovedBg   = "#343d5c"
contextBg        = "#222436"
contextContentBg = "#222436"
addedSignColor   = "#b8db87" # git.add
removedSignColor = "#e26a75" # git.delete
 
# Gutter
lineNumberBg = "#222436"
lineNumberFg = "#545c7e"     # dark3 #545c7e (nvim/delta use fg_gutter #3b4261, which is very faint)
selectedHunk = "#2f334d"     # bg_highlight (cursorline)
 
# Sidebar / badges
badgeAdded    = "#b8db87"
badgeRemoved  = "#e26a75"
badgeNeutral  = "#828bb8"
fileNew       = "#b8db87"    # git.add
fileDeleted   = "#e26a75"    # git.delete
fileModified  = "#7ca1f2"    # git.change
fileRenamed   = "#ffc777"    # yellow
fileUntracked = "#c099ff"    # magenta (neo-tree untracked)
 
# Inline notes styled like tokyonight floats
noteBorder          = "#589ed7" # border_highlight
noteBackground      = "#1e2030" # bg_float
noteTitleBackground = "#1e2030"
noteTitleText       = "#589ed7" # FloatTitle
 
# Every selector of the bundled tokyo-night (Night) theme, recoloured with Moon.
# Same selectors as the base, so these always win over the Night originals.
